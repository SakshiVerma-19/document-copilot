[project]
name = "document-copilot-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.20.0",
    "fastapi==0.142.2",
    "httpx==0.28.1",
    "openai==3.24.0",
    "psycopg2-binary==2.9.13",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.1.3",
    "structlog==26.1.0",
    "supabase==2.32.0",
    "uvicorn[standard]==0.54.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
add-bounds = "exact"
exclude-newer = "7 days"

[dependency-groups]
dev = [
    "ipykernel==7.4.0",
    "pytest==9.1.1",
    "ruff==0.16.10",
]
